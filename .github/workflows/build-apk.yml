name: Build Arabic APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.6.2-ar)'
        required: false
        default: 'v1.6.2-arabic'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Fix libdartjni build ID
        run: |
          find ~/.pub-cache -name "CMakeLists.txt" -path "*/jni-*/*" | xargs -r sed -i -e 's/-Wl,/-Wl,--build-id=none,/' || true

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/flut-renamer.jks
          echo "KEYSTORE=$RUNNER_TEMP/flut-renamer.jks" >> $GITHUB_ENV

      - name: Build APK (release signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=KEYSTORE=$KEYSTORE \
            --dart-define=KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD \
            --dart-define=KEY_ALIAS=$KEY_ALIAS \
            --dart-define=KEY_PASSWORD=$KEY_PASSWORD

      - name: Sign APKs with jarsigner
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd build/app/outputs/flutter-apk/
          for apk in app-*-release.apk; do
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore $KEYSTORE \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$apk" "$KEY_ALIAS"
          done

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk/
          mv app-arm64-v8a-release.apk   flut-renamer-arabic-arm64.apk   || true
          mv app-armeabi-v7a-release.apk flut-renamer-arabic-arm32.apk   || true
          mv app-x86_64-release.apk      flut-renamer-arabic-x86_64.apk  || true
          ls -lh *.apk

      - name: Remove keystore
        if: always()
        run: rm -f $RUNNER_TEMP/flut-renamer.jks

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "مُعيد التسمية — نسخة عربية ${{ github.event.inputs.release_tag }}"
          body: |
            ## نسخة عربية محسّنة من Flut Renamer

            ### ما الجديد في هذه النسخة؟
            - ✅ واجهة عربية كاملة مع دعم RTL
            - ✅ إصلاح ٩ أخطاء في الترجمة الرسمية
            - ✅ اسم التطبيق: **مُعيد التسمية**
            - ✅ نسخة release موقّعة (~١٠ MB)

            ### تنزيل الملف المناسب لجهازك
            | الملف | المعالج |
            |-------|---------|
            | `flut-renamer-arabic-arm64.apk` | أجهزة حديثة (2018+) ✅ الأغلب |
            | `flut-renamer-arabic-arm32.apk` | أجهزة قديمة |
            | `flut-renamer-arabic-x86_64.apk` | محاكيات |

            > إذا لم تعرف نوع معالجك، نزّل **arm64** فهو الأشيع.
          files: |
            build/app/outputs/flutter-apk/flut-renamer-arabic-arm64.apk
            build/app/outputs/flutter-apk/flut-renamer-arabic-arm32.apk
            build/app/outputs/flutter-apk/flut-renamer-arabic-x86_64.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
